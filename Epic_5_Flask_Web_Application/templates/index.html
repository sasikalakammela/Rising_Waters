<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Flood Prediction System</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container">

    <h1>🌊 Flood Prediction System</h1>

    <p class="subtitle">
        Machine Learning Based Flood Risk Prediction
    </p>

    <div class="top-cards">

        <div class="card">
            <h3>Algorithm</h3>
            <p>XGBoost</p>
        </div>

        <div class="card">
            <h3>Accuracy</h3>
            <p>100%</p>
        </div>

        <div class="card">
            <h3>Prediction</h3>
            <p>Real Time</p>
        </div>

    </div>

    <form action="/predict" method="POST">

        <label>🌡 Temperature (°C)</label>
        <input type="number" step="any" name="Temp" placeholder="Enter temperature" required>

        <label>💧 Humidity (%)</label>
        <input type="number" step="any" name="Humidity" placeholder="Enter humidity" required>

        <label>☁ Cloud Cover (%)</label>
        <input type="number" step="any" name="Cloud Cover" placeholder="Enter cloud cover" required>

        <label>🌧 Annual Rainfall (mm)</label>
        <input type="number" step="any" name="ANNUAL" placeholder="Annual rainfall" required>

        <label>🌦 Jan–Feb Rainfall</label>
        <input type="number" step="any" name="Jan-Feb" placeholder="Winter rainfall" required>

        <label>🌤 Mar–May Rainfall</label>
        <input type="number" step="any" name="Mar-May" placeholder="Pre-monsoon rainfall" required>

        <label>🌧 Jun–Sep Rainfall</label>
        <input type="number" step="any" name="Jun-Sep" placeholder="Monsoon rainfall" required>

        <label>🍂 Oct–Dec Rainfall</label>
        <input type="number" step="any" name="Oct-Dec" placeholder="Post-monsoon rainfall" required>

        <label>📊 Average June Rainfall</label>
        <input type="number" step="any" name="avgjune" placeholder="Average rainfall" required>

        <label>📍 Sub Region</label>
        <input type="number" step="any" name="sub" placeholder="Region ID" required>

        <button type="submit">
            🔍 Predict Flood Risk
        </button>

    </form>

</div>

</body>
</html>
